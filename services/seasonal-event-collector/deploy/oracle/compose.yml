name: seasonal-event-collector

services:
  collector:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: seasonal-event-collector:oracle-arm64
    user: "${COLLECTOR_UID:?set COLLECTOR_UID in .env}:${COLLECTOR_GID:?set COLLECTOR_GID in .env}"
    env_file:
      - .env
    environment:
      COLLECTOR_CONFIG_FILE: /app/config/collector.json
      CANDIDATE_OUTPUT_FILE: /app/output/candidates.json
      HOME: /tmp
      OUTPUT_FILE: /app/output/events.json
      PUBLISH_MODE: filesystem
      STATUS_OUTPUT_FILE: /app/status/latest.json
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ../../config
        target: /app/config
        read_only: true
      - type: bind
        source: ${COLLECTOR_OUTPUT_DIR:-./output}
        target: /app/output
      - type: bind
        source: ${COLLECTOR_STATUS_DIR:-./status}
        target: /app/status
    init: true
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"
