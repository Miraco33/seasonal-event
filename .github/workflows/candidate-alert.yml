name: Seasonal event attention

on:
  push:
    branches:
      - main
    paths:
      - data/seasonal-event/candidates.json
      - .github/workflows/candidate-alert.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seasonal-event-attention
  cancel-in-progress: true

jobs:
  update-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Open, update, or close the attention issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- seasonal-event-collector-attention -->";
            const report = JSON.parse(fs.readFileSync("data/seasonal-event/candidates.json", "utf8"));
            if (report.schemaVersion !== 1 || !Array.isArray(report.candidates)) {
              throw new Error("Unsupported candidate report schema");
            }
            const candidates = Array.isArray(report.candidates) ? report.candidates : [];
            if (report.status === "unknown" && report.code === "not_evaluated" && candidates.length === 0) return;
            const allowedStatuses = new Set(["ok", "alert", "review_required", "error"]);
            if (!allowedStatuses.has(report.status)) throw new Error(`Unknown candidate report status: ${String(report.status)}`);
            const needsAttention = report.status !== "ok";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues.find((issue) =>
              !issue.pull_request &&
              issue.user?.login === "github-actions[bot]" &&
              issue.body?.includes(marker));

            if (!needsAttention) {
              if (existing?.state === "open") {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }

            const reasonByCode = {
              candidate_review_required: "发现了官方活动专题，但尚不能核验标题或时间，需要补充资料。",
              event_ending_without_candidate: "当前活动即将结束，但尚未发现或批准下一场活动。",
              no_active_event_without_candidate: "当前没有开放活动，也没有待审核的下一活动。",
              candidate_discovery_failed: "官方活动公告检查失败，需要查看东京服务器上的最近运行状态。",
              candidate_collection_failed: "部分官方活动资料读取或校验失败，已保留上次核验的数据。",
              image_enrichment_incomplete: "活动已经收录，但部分任务图片无法与游戏数据唯一核验，缺失字段保持未知。",
              run_failed: "采集或发布前校验失败，需要查看东京服务器上的最近运行状态。",
            };
            const titleByCode = {
              candidate_review_required: "【自动提醒】发现新的季节活动，等待审核",
              event_ending_without_candidate: "【自动提醒】当前活动即将结束，尚未发现下一活动",
              no_active_event_without_candidate: "【自动提醒】当前无开放活动，尚未发现下一活动",
              candidate_discovery_failed: "【自动告警】官方活动公告检查失败",
              candidate_collection_failed: "【自动告警】部分活动资料读取失败",
              image_enrichment_incomplete: "【自动告警】活动图片资料未能完整核验",
              run_failed: "【自动告警】季节活动采集运行失败",
            };
            const gapNames = {
              required_title_or_time_not_verified: "核验活动标题和完整起止时间",
              detail_fields_not_inspected: "核对标题、时间、任务与 NPC",
              stable_event_id: "分配稳定活动 ID",
              location_override: "补充任务接取位置",
              reward_override: "补充奖励资料",
              completion_override: "核实任务、成就与传送 ID",
              image_ocr_failed: "检查图片识别引擎和中英文模型是否可用",
              quest_not_in_game_index: "更新国服任务索引并核验新任务",
              ambiguous_game_quest: "核验同名任务，不能自动选择",
              image_map_not_verified: "核验图片坐标与任务地图，地图按钮保持禁用",
            };
            const lines = [
              marker,
              "> 此 Issue 由活动采集器自动维护，用于提醒仓库维护者；它不表示插件客户端发生故障。",
              "",
              reasonByCode[report.code] || `采集器报告需要处理：${String(report.code || "unknown")}`,
              "",
              `状态：\`${String(report.status || "unknown")}\`  原因：\`${String(report.code || "unknown")}\``,
            ];
            if (candidates.length > 0) {
              lines.push("", "待审核专题：");
              for (const candidate of candidates) {
                const title = String(candidate.title || "未命名活动")
                  .replace(/@/g, "@\u200b")
                  .replace(/([\\`*_{}\[\]()#+\-.!|>])/g, "\\$1")
                  .replace(/[\r\n]/g, " ")
                  .trim();
                const url = String(candidate.url || "");
                const gaps = Array.isArray(candidate.reviewGaps)
                  ? candidate.reviewGaps.map((gap) => gapNames[gap] || String(gap)).join("、")
                  : "核对活动资料";
                lines.push(`- **${title || "未命名活动"}**：<${url}>`, `  - 待处理：${gaps}`);
              }
            }
            lines.push("", "处理步骤见 `services/seasonal-event-collector/README.md` 的“发现、补充资料与待审核处理”。状态恢复正常后，此 Issue 会自动关闭。");
            const body = lines.join("\n");
            const title = titleByCode[report.code] || "【自动告警】季节活动采集需要处理";

            if (existing) {
              if (existing.state !== "open" || existing.title !== title || existing.body !== body) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title,
                  body,
                  state: "open",
                });
              }
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
