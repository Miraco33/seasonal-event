name: Collector checks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/collector-ci.yml
      - services/seasonal-event-collector/**
  pull_request:
    paths:
      - .github/workflows/collector-ci.yml
      - services/seasonal-event-collector/**
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 1"

permissions:
  contents: read

concurrency:
  group: collector-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: services/seasonal-event-collector
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/seasonal-event-collector/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build collector
        run: npm run build

      - name: Run collector tests
        run: npm test

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit 2025-2026 official pages
        run: npm run audit:recent
